name: motorclub
services:
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-33067}:3306'
    environment:
      MYSQL_DATABASE: motorclub
      MYSQL_USER: motorclub
      MYSQL_PASSWORD: '${DB_PASSWORD:-local-only-change-me}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-local-root-only-change-me}'
    volumes:
      - motorclub-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  motorclub-mysql:
