name: motorclub-production
services:
  app:
    build: .
    restart: unless-stopped
    env_file: '${APP_ENV_FILE:-.env.production}'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: '${DOMAIN:?Defina DOMAIN}'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: motorclub
      MYSQL_USER: motorclub
      MYSQL_PASSWORD: '${DB_PASSWORD:?Defina DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}'
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  private-files:
  app-logs:
  database:
  caddy-data:
  caddy-config:
